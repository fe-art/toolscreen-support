# Quick auto-replies for #help channel.
# Each rule: id, trigger phrases (case-insensitive substring), reply.
# First matching rule wins. One reply per message.
# Optional max_length: only trigger if message is shorter than N characters
#   (useful for vague/generic patterns to avoid matching detailed messages).

rules:
  - id: tabs_out
    title: Tabbing out (NinjaBrain)
    patterns:
      - "tabs me out"
      - "tabs out"
      - "tabbing out"
      - "tabbed out"
    reply: |
      NinjaBrainBot's "Toggle Visibility" hotkey brings its window into focus, which tabs you out of Minecraft.

      **Fix:** disable the "Toggle Visibility" hotkey in NinjaBrainBot settings, and use Toolscreen's instead: **Advanced > Hotkeys > Toggle Window Overlays**

  - id: cant_find_jar
    title: Jar deleted by antivirus
    patterns:
      - "can't find jar"
      - "cannot find jar"
      - "jar disappeared"
      - "jar is missing"
      - "jar missing"
      - "jar is gone"
      - "jar gone"
      - "jar not there"
      - "jar deleted"
      - "jar got deleted"
      - "access jarfile"
    reply: |
      Your .jar was likely **deleted by your antivirus**. Toolscreen uses DLL injection, so antivirus flags it as malicious (false positive).

      **Fix:**
      1. Check your antivirus **quarantine/history** and restore any Toolscreen files
      2. Add a **folder** exclusion for the Toolscreen .jar and the `.config\toolscreen\dlls` folder
      3. Re-download and install

  - id: cant_download
    title: Download blocked by browser
    patterns:
      - "can't download"
      - "cannot download"
      - "cant download"
      - "download blocked"
      - "chrome blocked"
      - "browser blocked"
      - "not commonly downloaded"
      - "could harm your"
      - "dangerous file"
    reply: |
      Chrome (and some other browsers) flag the .jar as "not commonly downloaded". This is a false positive — click "Keep" on the download warning, or go to `chrome://downloads` and keep it from there.

      If the download still fails, make sure you turn off **Smart App Control**: **Windows Settings > Privacy & security > Windows Security > App & browser control > Smart App Control > Off**

      If it still won't work, try a different browser like Edge or Firefox.

  - id: virus_detected
    title: Antivirus false positive
    patterns:
      - "virus detected"
      - "flagged as virus"
      - "flagged as a virus"
      - "detected as virus"
      - "detected as a virus"
      - "detected as trojan"
      - "trojan detected"
      - "flagged as malicious"
      - "flagged as trojan"
      - "found as a virus"
      - "identified as a virus"
      - "identified as trojan"
      - "defender blocked"
      - "defender removes"
      - "defender flagged"
      - "defender catches"
      - "defender detected"
      - "antivirus blocked"
      - "antivirus removes"
      - "antivirus flagged"
      - "antivirus detected"
      - "antivirus deleted"
      - "suschill"
      - "suschil"
    reply: |
      Toolscreen uses DLL injection, so antivirus flags it as malicious (false positive).

      **Fix:** temporarily turn off **Real-time protection** in **Virus & threat protection settings** in your antivirus, install Toolscreen, then re-enable it. Add a **folder** exclusion for the .jar and the `.config\toolscreen\dlls` folder so it doesn't get flagged again.

  - id: not_a_mod
    title: Not a mod (wrong install)
    listed: false
    patterns:
      - "mod crashed on startup"
      - "mod crashed"
      - "crash on startup"
    reply: |
      Toolscreen is **not a mod** — don't put it in your mods folder. Place the .jar in your instance folder and double-click it to run the installer.

  - id: corrupt_file
    title: Invalid/corrupt jarfile
    patterns:
      - "invalid or corrupt"
      - "corrupt file"
      - "corrupt jar"
    reply: |
      If your .jar shows 0 KB, your browser corrupted the download. Check if you can allow it from the downloads page (`Ctrl+J`), or try another browser.

      Otherwise, re-run the Toolscreen installer — download the latest .jar and double-click it. Your config and settings are stored separately (`C:\Users\<username>\.config\toolscreen\`) and won't be affected.

  - id: not_showing_up
    title: Overlay not showing up
    patterns:
      - "toolscreen not showing"
      - "toolscreen doesn't show"
      - "toolscreen doesnt show"
      - "toolscreen won't show"
      - "toolscreen wont show"
      - "toolscreen not appearing"
      - "toolscreen doesn't appear"
      - "toolscreen doesnt appear"
      - "overlay not showing"
      - "overlay doesn't show"
      - "overlay not appearing"
      - "smart app control"
    reply: |
      Common causes:

      1. **Smart App Control** is blocking it silently — turn it off: **Windows + I > Privacy & security > Windows Security > App & browser control > Smart App Control > Off**
      2. **Antivirus** deleted the DLL — check if `toolscreen.dll` is still in `.config\toolscreen\dlls`. If not, add a folder exclusion and reinstall.
      3. **Wrong capture method** — try toggling **Force Update** or switching capture method in Toolscreen settings.

  - id: hotkey_in_inventory
    title: Hotkeys triggering in menus
    patterns:
      - "!inv"
      - "hotkey in inventory"
      - "hotkeys in inventory"
      - "hotkey in menu"
      - "hotkeys in menu"
      - "hotkeys in chat"
      - "hotkey in chat"
      - "keybind in chat"
      - "keybinds in chat"
      - "keybind in inventory"
      - "keybinds in inventory"
      - "hotkeys in crafting"
      - "hotkey in crafting"
      - "hotkeys not work in chat"
      - "hotkeys not work in crafting"
      - "disable hotkeys when typing"
      - "disable keybinds when typing"
      - "disable hotkeys when in chat"
      - "not work when typing"
      - "not happen when chat"
      - "activates in inventory"
      - "activates in crafting"
      - "activates in chat"
      - "triggers in inventory"
      - "triggers in chat"
      - "triggers in crafting"
      - "disable when typing in chat"
      - "disable when in chat"
      - "macros in menus"
      - "resize in inventory"
      - "resize in menu"
      - "resizing not work when typing"
    reply: |
      Go to **Advanced > Hotkeys** > select the hotkey > **Required Game States**, untick **Any**, tick **In World (Cursor Grabbed)** and untick **In World (Cursor Free)**.

      This way the hotkey only fires when you're actually playing, not in inventory or pause screens.

  - id: change_background
    title: Custom background/images
    listed: false
    patterns:
      - "!bg"
      - "change background"
      - "change the background"
      - "change bg"
      - "change the bg"
      - "add background"
      - "add a background"
      - "set background"
      - "custom background"
      - "background color"
      - "background image"
      - "background picture"
      - "add image"
      - "add picture"
      - "add images"
      - "add pictures"
      - "put image"
      - "put images"
      - "image in the background"
      - "images in the background"
      - "purple gradient"
      - "default purple"
    reply: |
      For small image overlays (PNGs on screen): **Advanced > Overlays > Images**

      For mode backgrounds (behind thin/wide/eye zoom): **Advanced > Mode** > select the mode > **Background**, set it to Color, Image, or Gradient.

  - id: failed_locale
    title: Failed to find locale (OBS)
    listed: false
    patterns:
      - "failed to find locale"
      - "find locale"
    reply: |
      This usually happens when a pre-launch command to start OBS (or another program) doesn't set the working directory correctly.

      **Fix:** use `start` with an explicit working directory:
      ```
      start "" /D "C:\Program Files\obs-studio\bin\64bit" obs64.exe
      ```
      Adjust the path to match your OBS install location.

  - id: cant_update
    title: Cannot update (antivirus)
    patterns:
      - "unwanted software"
      - "contains a virus"
    reply: |
      Toolscreen uses DLL injection, which antivirus software flags as malicious (false positive).

      **Fix:** disable your antivirus during the update (on Windows, that's **Real-time protection** in Virus & threat protection settings), or download the new .jar from the [release page](https://github.com/jojoe77777/Toolscreen/releases) and run the installer again (for MCSR Launcher, only option 1 works).
